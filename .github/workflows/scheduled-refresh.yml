name: Refresh Blizzard patch notes

on:
  schedule:
    - cron: "7 4 * * *"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without changing release files or publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: better-patch-notes-refresh
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      dry_run: ${{ steps.metadata.outputs.dry_run }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Prepare acquisition metadata
        id: metadata
        env:
          REQUESTED_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "artifact_name=english-acquisition-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "dry_run=$REQUESTED_DRY_RUN" >> "$GITHUB_OUTPUT"
      - name: Acquire and compare English data
        continue-on-error: true
        run: python -m automation.acquisition --output .bpn-work/acquisition
      - name: Read acquisition result
        id: result
        if: always()
        run: |
          result=.bpn-work/acquisition/acquisition-result.json
          test -f "$result"
          outcome="$(python -c "import json; print(json.load(open('$result', encoding='utf-8'))['status'])")"
          case "$outcome" in
            NO_CHANGE|DATA_CHANGED|BLOCKED) ;;
            *) echo "Unknown acquisition outcome: $outcome"; exit 1 ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
      - name: Write acquisition summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(
              Path(".bpn-work/acquisition/acquisition-result.json").read_text(
                  encoding="utf-8"
              )
          )
          print("## Better Patch Notes acquisition")
          print(f"- Outcome: {result.get('status', 'UNKNOWN')}")
          print(f"- Accepted English records: {result.get('accepted', 0)}")
          PY
      - name: Upload English acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: .bpn-work/acquisition/
          if-no-files-found: error
          retention-days: 30

  translate:
    needs: acquire
    if: needs.acquire.outputs.outcome == 'DATA_CHANGED'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        locale: [deDE, esES, esMX, frFR, itIT, koKR, ptBR, ruRU, zhCN, zhTW]
    steps:
      - name: Check out translation code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Download English acquisition artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acquire.outputs.artifact_name }}
          path: .bpn-work/acquisition
      - name: Translate and validate ${{ matrix.locale }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
        run: |
          mkdir -p ".bpn-work/translation-${{ matrix.locale }}"
          python -m automation.translate_locale \
            --locale "${{ matrix.locale }}" \
            --english .bpn-work/acquisition/english-document.json \
            --terminology .bpn-work/acquisition/runtime-terminology.json \
            --output ".bpn-work/translation-${{ matrix.locale }}/locale-result.json"
      - name: Upload translation-${{ matrix.locale }} artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-${{ matrix.locale }}-${{ github.run_id }}
          path: .bpn-work/translation-${{ matrix.locale }}/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce locale result
        if: always()
        run: |
          result=".bpn-work/translation-${{ matrix.locale }}/locale-result.json"
          test -f "$result"
          test "$(python -c "import json; print(json.load(open('$result', encoding='utf-8'))['status'])")" = PASS

  aggregate:
    needs: [acquire, translate]
    if: always() && needs.acquire.outputs.outcome == 'DATA_CHANGED'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      dry_run: ${{ needs.acquire.outputs.dry_run }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: web-app/.nvmrc
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Install validation dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          npm ci --prefix web-app
      - name: Prepare aggregation metadata
        id: metadata
        run: echo "artifact_name=refresh-audit-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Download English acquisition artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acquire.outputs.artifact_name }}
          path: .bpn-work/acquisition
      - name: Download locale translation artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: translation-*-${{ github.run_id }}
          path: .bpn-work/translations
      - name: Aggregate and coordinate release
        if: always()
        continue-on-error: true
        run: |
          dry_run_argument=()
          if [ "${{ needs.acquire.outputs.dry_run }}" = "true" ]; then
            dry_run_argument=(--dry-run)
          fi
          python -m automation.aggregate_translations \
            --acquisition .bpn-work/acquisition \
            --translations .bpn-work/translations \
            --result .bpn-work/automation-result.json \
            "${dry_run_argument[@]}"
      - name: Read coordinator result
        id: result
        if: always()
        run: |
          result=.bpn-work/automation-result.json
          test -f "$result"
          outcome="$(python -c "import json; print(json.load(open('$result', encoding='utf-8'))['status'])")"
          case "$outcome" in
            NO_CHANGE|BLOCKED|RELEASE_READY) ;;
            *) echo "Unknown coordinator outcome: $outcome"; exit 1 ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          test "$outcome" != BLOCKED
      - name: Write refresh summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(
              Path(".bpn-work/automation-result.json").read_text(
                  encoding="utf-8"
              )
          )
          print("## Better Patch Notes refresh")
          print(f"- Outcome: {result.get('status', 'UNKNOWN')}")
          print(
              "- Preserved English terminology warnings: "
              f"{result.get('terminologyWarningCount', 0)}"
          )
          warning_counts = result.get("terminologyWarningsByLocale", {})
          if warning_counts:
              print(
                  "- Warning counts by locale: "
                  + ", ".join(
                      f"{locale}: {count}"
                      for locale, count in sorted(warning_counts.items())
                  )
              )
          PY
      - name: Run complete Python suite
        if: steps.result.outputs.outcome == 'RELEASE_READY' && needs.acquire.outputs.dry_run != 'true'
        run: python -m unittest discover -s tests -v
      - name: Test and build public website
        if: steps.result.outputs.outcome == 'RELEASE_READY' && needs.acquire.outputs.dry_run != 'true'
        working-directory: web-app
        run: |
          npm run prepare:data
          npm test
          npm run build
      - name: Validate exact release diff
        if: steps.result.outputs.outcome == 'RELEASE_READY' && needs.acquire.outputs.dry_run != 'true'
        run: |
          git diff --check
          allowed='^(Addon.lua|BetterPatchNotes.toc|PatchNotesData.lua|README.md|changelog.txt|data/retail-patch-notes.json)$'
          changed_files="$(git status --short | sed -E 's/^...//')"
          test -n "$changed_files"
          while IFS= read -r changed_file; do
            if ! grep -Eq "$allowed" <<< "$changed_file"; then
              echo "Refresh produced an unauthorized file change: $changed_file"
              exit 1
            fi
          done <<< "$changed_files"
      - name: Commit verified data release
        id: commit
        if: steps.result.outputs.outcome == 'RELEASE_READY' && needs.acquire.outputs.dry_run != 'true'
        run: |
          release_date="$(python -c "import json; print(json.load(open('.bpn-work/automation-result.json', encoding='utf-8'))['asOfDate'])")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- BetterPatchNotes.toc Addon.lua README.md changelog.txt \
            PatchNotesData.lua data/retail-patch-notes.json
          git diff --cached --check
          git commit -m "data: refresh retail patch notes for $release_date"
          commit_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
      - name: Upload refresh audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: .bpn-work/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  release:
    needs: aggregate
    if: >-
      needs.aggregate.result == 'success' &&
      needs.aggregate.outputs.outcome == 'RELEASE_READY' &&
      needs.aggregate.outputs.dry_run != 'true'
    uses: ./.github/workflows/release.yml
    with:
      commit_sha: ${{ needs.aggregate.outputs.commit_sha }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  report:
    needs: [acquire, translate, aggregate, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out reporting code
        uses: actions/checkout@v6
      - name: Download refresh audit
        if: needs.aggregate.outputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.aggregate.outputs.artifact_name }}
          path: .bpn-work
      - name: Download blocked acquisition audit
        if: needs.aggregate.outputs.artifact_name == '' && needs.acquire.outputs.outcome == 'BLOCKED'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acquire.outputs.artifact_name }}
          path: .bpn-work/acquisition
      - name: Prepare blocked acquisition result
        if: needs.aggregate.outputs.artifact_name == '' && needs.acquire.outputs.outcome == 'BLOCKED'
        run: cp .bpn-work/acquisition/acquisition-result.json .bpn-work/automation-result.json
      - name: Prepare unexpected failure result
        if: >-
          always() &&
          hashFiles('.bpn-work/automation-result.json') == '' &&
          (needs.acquire.result == 'failure' ||
          needs.aggregate.result == 'failure')
        run: |
          mkdir -p .bpn-work
          python - <<'PY'
          import json
          from pathlib import Path

          Path(".bpn-work/automation-result.json").write_text(
              json.dumps(
                  {
                      "status": "BLOCKED",
                      "reason": "workflow job failed before producing an audit result",
                      "sourceUrls": [],
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Create or update a blocked-refresh issue
        if: >-
          always() &&
          (needs.acquire.result == 'failure' ||
          needs.acquire.outputs.outcome == 'BLOCKED' ||
          needs.translate.result == 'failure' ||
          needs.aggregate.result == 'failure' ||
          needs.aggregate.outputs.outcome == 'BLOCKED' ||
          needs.release.result == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_NAME: ${{ needs.aggregate.outputs.artifact_name || needs.acquire.outputs.artifact_name }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          stage=translation
          if [ "$RELEASE_RESULT" = failure ]; then
            stage=curseforge-release
          fi
          python -m automation.reporting \
            --result .bpn-work/automation-result.json \
            --stage "$stage" \
            --workflow-url "$WORKFLOW_URL" \
            --artifact-name "$ARTIFACT_NAME" \
            --output .bpn-work/issue.json
          issue_number="$(gh issue list --state open --limit 100 \
            --json number,body \
            --jq '.[] | select(.body | contains("better-patch-notes-automation")) | .number' \
            | head -n 1)"
          title="$(python -c "import json; print(json.load(open('.bpn-work/issue.json', encoding='utf-8'))['title'])")"
          python -c "import json; print(json.load(open('.bpn-work/issue.json', encoding='utf-8'))['body'])" > .bpn-work/issue-body.md
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --title "$title" --body-file .bpn-work/issue-body.md
          else
            gh issue create --title "$title" --body-file .bpn-work/issue-body.md
          fi
          exit 1
      - name: Close the previous blocked-refresh issue
        if: >-
          needs.aggregate.outputs.outcome == 'RELEASE_READY' &&
          needs.aggregate.outputs.dry_run != 'true' &&
          needs.release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(gh issue list --state open --limit 100 \
            --json number,body \
            --jq '.[] | select(.body | contains("better-patch-notes-automation")) | .number' \
            | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" \
              --comment "A later automatic refresh completed successfully."
          fi
