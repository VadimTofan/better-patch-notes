[build]
  base = "web-app"
  command = "npm run build"
  ignore = "node scripts/netlify-ignore.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.15.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
